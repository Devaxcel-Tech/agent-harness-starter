name: secret-scan
# Catches a credential BEFORE it becomes permanent. Once a secret is in history, rotating it is the
# only real fix — so the entire value of this job is catching the FIRST commit that carries one.
#
# Blocking on purpose: a secret scan a merge can ignore is decoration.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. A shallow clone silently scans only the tip and reports "no leaks found" for
          # a repo it barely looked at — the could-not-run-reported-as-a-pass failure again.
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        if: ${{ !cancelled() }}
        env:
          VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      # --redact is NOT optional. Without it a detected secret is printed into a CI log, turning the
      # detector into a second disclosure channel. File, line and rule are still reported.
      - name: Scan history
        if: ${{ !cancelled() }}
        run: gitleaks git --no-banner --redact --config .gitleaks.toml .
      - name: Scan the working tree
        if: ${{ !cancelled() }}
        run: gitleaks dir --no-banner --redact --config .gitleaks.toml .
      - name: What to do if this failed
        if: failure()
        run: |
          cat <<'MSG'
          A credential was detected. Do NOT just amend the commit away — if it was ever
          pushed, treat it as disclosed.
            1. ROTATE it first. That is the only step that actually fixes anything.
            2. Replace the literal with an environment variable or a secret manager.
            3. If it reached a pushed branch, the history needs rewriting — raise it
               rather than force-pushing over it unilaterally.
          If it is a FALSE POSITIVE, add a narrow, commented PATH entry to .gitleaks.toml.
          Never allowlist by value, and never exempt a whole directory ahead of need.
          MSG
